[project]
name = "spotify-clone-backend"
version = "1.0.0"
description = "Django REST API for the Spotify clone"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used for local `pip install -r`).
dependencies = [
    "Django==5.2.18",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "django-filter==26.2",
    "Pillow==12.3.0",
    "cloudinary==1.46.3",
    "dj-database-url==3.1.2",
    "psycopg2-binary==2.9.13",
    "whitenoise==6.12.0",
]

[tool.vercel.scripts]
# Runs on every Vercel deploy, after dependencies are installed.
# (Vercel runs collectstatic itself.)
build = "python vercel_build.py"
